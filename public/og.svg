<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Social preview palette pulled from the 🔒 emoji rendering across platforms:
    warm gold body (#f5b400 / #ffd54a), darker amber edge (#a86a00),
    on a deep warm-charcoal background.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a10" />
      <stop offset="1" stop-color="#100b07" />
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#f5b400" stop-opacity="0.42" />
      <stop offset="1" stop-color="#f5b400" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54a" />
      <stop offset="1" stop-color="#d99500" />
    </linearGradient>
    <linearGradient id="shackleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcfcf" />
      <stop offset="1" stop-color="#7a7a7a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Vector padlock on the right.
       Shackle is a thick stroked U; body is a rounded rectangle. -->
  <g transform="translate(880 130)">
    <path d="M 60 175 L 60 110 a 80 80 0 0 1 160 0 L 220 175"
          fill="none" stroke="url(#shackleFill)" stroke-width="32"
          stroke-linecap="round" />
    <rect x="20" y="175" width="240" height="220" rx="28"
          fill="url(#bodyFill)" stroke="#a86a00" stroke-width="4" />
    <!-- Keyhole. -->
    <circle cx="140" cy="275" r="20" fill="#3a2400" />
    <rect x="133" y="285" width="14" height="54" rx="3" fill="#3a2400" />
  </g>

  <!-- Wordmark + tagline. Cream/gold for warmth against the dark backdrop. -->
  <text x="80" y="280" fill="#fff5d6"
        font-family="DejaVu Sans, system-ui, -apple-system, Arial, sans-serif"
        font-size="120" font-weight="800" letter-spacing="-3">lockmeup</text>
  <text x="80" y="345" fill="#f5d089"
        font-family="DejaVu Sans, system-ui, -apple-system, Arial, sans-serif"
        font-size="32" font-weight="500">a self-locking commitment app for your browser</text>

  <!-- Feature pills (no emoji — resvg cannot render colour emoji reliably). -->
  <g font-family="DejaVu Sans, system-ui, -apple-system, Arial, sans-serif"
     font-size="26" font-weight="600" fill="#fff5d6">
    <g transform="translate(80 430)">
      <rect width="160" height="56" rx="28"
            fill="#f5b400" fill-opacity="0.12"
            stroke="#f5b400" stroke-opacity="0.45" />
      <text x="80" y="36" text-anchor="middle">Puzzles</text>
    </g>
    <g transform="translate(256 430)">
      <rect width="160" height="56" rx="28"
            fill="#f5b400" fill-opacity="0.12"
            stroke="#f5b400" stroke-opacity="0.45" />
      <text x="80" y="36" text-anchor="middle">Timers</text>
    </g>
    <g transform="translate(432 430)">
      <rect width="200" height="56" rx="28"
            fill="#f5b400" fill-opacity="0.12"
            stroke="#f5b400" stroke-opacity="0.45" />
      <text x="100" y="36" text-anchor="middle">Hold-still</text>
    </g>
    <g transform="translate(648 430)">
      <rect width="160" height="56" rx="28"
            fill="#f5b400" fill-opacity="0.12"
            stroke="#f5b400" stroke-opacity="0.45" />
      <text x="80" y="36" text-anchor="middle">Typing</text>
    </g>
  </g>

  <text x="80" y="560" fill="#a88958"
        font-family="DejaVu Sans, system-ui, -apple-system, Arial, sans-serif"
        font-size="22" font-weight="500">Runs entirely in the browser  ·  nothing leaves your device</text>
</svg>
